name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deno lint
        run: |
          cd supabase/functions/mcp
          deno lint .

      - name: Deno typecheck
        run: |
          cd supabase/functions/mcp
          deno check index.ts
